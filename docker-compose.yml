# FinGPT Docker Compose Configuration
# Quick start: docker compose up

services:
  api:
    build: ./Main/backend

    ports:
      # P0 Root C.1: publish only to loopback; the host reverse proxy (Caddy)
      # is the sole public entrypoint and sets X-Real-IP.
      - "127.0.0.1:8000:8000"

    env_file:
      - ./Main/backend/.env # API keys and configuration

    environment:
      - REDIS_URL=redis://redis:6379/0

    depends_on:
      redis:
        condition: service_healthy

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 1m

    restart: unless-stopped

    develop:
      watch:
        - action: sync
          path: ./Main/backend
          target: /app
          ignore:
            - .venv/
            - node_modules/
            - __pycache__/
            - "*.log"
            - embeddings.pkl
            - fine_tuning_data.pkl
        - action: rebuild
          path: ./Main/backend/pyproject.toml
        - action: rebuild
          path: ./Main/backend/uv.lock

    # Optional: Mount for live development (read-only for safety)
    volumes:
      - ./Main/backend/api:/app/api
      - ./Main/backend/datascraper:/app/datascraper
      - ./Main/backend/mcp_client:/app/mcp_client
      - ./Main/backend/mcp_server:/app/mcp_server
      - ./Main/backend/django_config:/app/django_config
      - ./Main/backend/prompts:/app/prompts
      - session_cache:/tmp/fingpt_cache

    networks:
      - fingpt_network

  redis:
    image: redis:7-alpine
    # Ephemeral cache only: no RDB snapshots, no AOF. Counters live in RAM and
    # rebuild naturally (short TTL for inflight, ~26h for daily run counts).
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - fingpt_network

  frontend:
    # Frontend extension build service (optional, for development)
    # Uncomment to build extension alongside backend
    # build: ./Main/frontend
    # command: bun run watch
    # volumes:
    #   - ./Main/frontend/src:/app/src:ro
    #   - ./Main/frontend/dist:/app/dist:rw
    # networks:
    #   - fingpt_network
    profiles:
      - dev # Only runs with: docker compose --profile dev up

volumes:
  session_cache:
    driver: local

networks:
  fingpt_network:
    driver: bridge
