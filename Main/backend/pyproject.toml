[project]
name = "fingpt-backend"
version = "0.16.0"
description = "FinGPT Backend - Financial GPT Assistant"
authors = [{ name = "FinGPT Team" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.15.0,<5",
    "django>=6.1,<7",
    "google==3.0.0",
    "markdown>=3.10.3,<4",
    "numpy>=2.5.1,<3",
    "openai>=2.53.0,<3",
    "openai-agents>=0.19.4,<1",
    "anthropic>=0.120.2,<1",
    "tiktoken>=0.13.0,<0.14",
    "requests>=2.34.2,<3",
    "redis>=5.0,<7",
    "pytz>=2025.1,<2027",
    "python-dotenv>=1.2.2,<2",
    "bs4>=0.0.2,<0.0.3",
    "django-cors-headers>=4.7.0,<5",
    "django-ratelimit>=4.1.0,<5",
    "pytest>=9.1.1,<10",
    "flask>=3.1.0,<4",
    "mcp[cli]>=1.28.1,<2",
    "fastmcp>=3.4.6,<4",
    "gunicorn>=25.3.0,<26",
    "whitenoise>=6.12.0,<7",
    "sec-edgar-mcp>=0.1.0",
    "Django>=6.0.5,<7 ; sys_platform == 'win32'",
    "Django>=6.0.5,<7 ; sys_platform == 'darwin'",
    "Django>=6.0.5,<7 ; sys_platform == 'linux'",
    "Django>=6.0.5,<7 ; sys_platform != 'win32' and sys_platform != 'darwin' and sys_platform != 'linux'",
    "mammoth>=1.12.0,<2 ; sys_platform == 'darwin'",
    "yfinance>=1.5.2",
    "playwright>=1.62.0,<2",
    "tradingview-ta>=3.3.0",
    "tradingview-screener>=3.2.1",
    "psutil>=7.0.0,<8",
    "exchange-calendars>=4.13.2",
    "pytest-asyncio>=1.4.0",
    "duckdb>=1.5.5",
]

[dependency-groups]
docs = [
    "sphinx>=8.0.0,<9",
    "sphinx-rtd-theme==3.1.0",
    "nbsphinx==0.9.8",
    "nbsphinx-link==1.4.1",
    "sphinx-autobuild==2024.10.3",
    "sphinx-design==0.7.0",
    "sphinxcontrib-applehelp==2.0.0",
    "sphinxcontrib-devhelp==2.0.0",
    "sphinxcontrib-htmlhelp==2.1.0",
    "sphinxcontrib-jquery==4.1",
    "sphinxcontrib-jsmath==1.0.1",
    "sphinxcontrib-qthelp==2.0.0",
    "sphinxcontrib-serializinghtml==2.0.0",
]

[tool.uv]
package = false
override-dependencies = [
    "protobuf>=6.33.5",        # CVE-2026-0994: JSON recursion depth bypass
    "PyJWT>=2.13.0",           # GHSA: HS256 forgery via JWK, algo allow-list bypass, file:// SSRF, DoS (via mcp)
    "tornado>=6.5.7",          # GHSA: cross-origin auth-header forward, gzip bomb, curl cred leak (via jupyter_client)
    "urllib3>=2.7.0",          # GHSA: sensitive header forwarding + decompression-bomb bypass
    "python-multipart>=0.0.31",# GHSA: quadratic querystring DoS, param smuggling, negative Content-Length OOM
    "idna>=3.15",              # GHSA: CVE-2024-3651 fix bypass via crafted inputs
    "authlib>=1.6.12",         # GHSA: OIDC open redirect in implicit/hybrid flow
    "cryptography>=48.0.1",    # GHSA: vulnerable OpenSSL bundled in wheels (via authlib)
    # [css] is load-bearing: overrides REPLACE nbconvert's `bleach[css]` requirement,
    # and dropping the extra loses tinycss2 -> nbconvert crashes at import (NameError:
    # ALLOWED_STYLES in its no-css-sanitizer fallback path), breaking the docs build.
    "bleach[css]>=6.4.0",      # GHSA: formaction URI bypass + Unicode scheme sanitization gap
    "starlette>=1.3.1",        # GHSA: form-limit DoS, UNC SSRF, host poisoning, getattr dispatch (via mcp)
    "mistune>=3.3.0",          # GHSA: quadratic-time parse_link_text DoS (Dependabot #183; via nbconvert)
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
